<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)" />
  <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <!-- Medical cross -->
  <rect x="48" y="28" width="24" height="64" rx="4" fill="url(#cross)" />
  <rect x="28" y="48" width="64" height="24" rx="4" fill="url(#cross)" />
  <!-- Heart beat line -->
  <polyline points="20,75 35,75 40,65 45,85 50,70 55,75 65,75 70,65 75,85 80,70 85,75 100,75" 
    fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Database dots -->
  <circle cx="30" cy="30" r="3" fill="rgba(255,255,255,0.4)" />
  <circle cx="90" cy="30" r="3" fill="rgba(255,255,255,0.4)" />
  <circle cx="30" cy="90" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="90" cy="90" r="2" fill="rgba(255,255,255,0.3)" />
</svg>
